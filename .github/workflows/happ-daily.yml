name: Daily rule sync and Happ snapshot

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: happ-daily-sync-release
  cancel-in-progress: false

jobs:
  sync-release:
    if: >-
      github.repository == 'lay-g/ios_rule_script' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
      GH_PROMPT_DISABLED: '1'
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout this fork at the triggering default-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up verified Go version (pinned geoip requires Go 1.26+)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build existing pinned compilers and reader; install fixed gh
        run: |
          TOOLS="$RUNNER_TEMP/happ-tools"
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/happ-output" >> "$GITHUB_ENV"
          mkdir -p "$TOOLS/bin"
          python3 - <<'PY' > "$RUNNER_TEMP/happ-pins.tsv"
          import sys
          sys.path.insert(0, 'tools/happ')
          from build import PINS
          for kind, (module, sha) in PINS.items():
              print(kind, module, sha, sep='\t')
          PY
          while IFS=$'\t' read -r kind module sha; do
            git init "$TOOLS/$kind"
            git -C "$TOOLS/$kind" remote add origin "https://$module.git"
            git -C "$TOOLS/$kind" fetch --depth=1 origin "$sha"
            git -C "$TOOLS/$kind" checkout --detach FETCH_HEAD
            test "$(git -C "$TOOLS/$kind" rev-parse HEAD)" = "$sha"
            (cd "$TOOLS/$kind" && go build -mod=readonly -o "$TOOLS/bin/$kind" .)
          done < "$RUNNER_TEMP/happ-pins.tsv"
          (cd "$TOOLS/geosite" && go build -mod=readonly -o "$TOOLS/bin/geo-reader" "$GITHUB_WORKSPACE/tools/happ/geo-reader.go")
          curl --fail --silent --show-error --location \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz \
            -o "$TOOLS/gh.tar.gz"
          echo "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be  $TOOLS/gh.tar.gz" | sha256sum --check
          tar -xzf "$TOOLS/gh.tar.gz" -C "$TOOLS"
          echo "$TOOLS/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Run local tests before touching the snapshot
        run: python3 -m unittest discover -s tools/happ -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/happ-tests.log"

      - name: Pin upstream master and apply only its entire rule tree
        id: source
        run: |
          git fetch --no-tags --depth=1 https://github.com/blackmatrix7/ios_rule_script.git refs/heads/master
          source_sha="$(git rev-parse FETCH_HEAD)"
          printf 'source=%s\ncheckout=%s\n' "$source_sha" "$BASE_SHA" > "$RUNNER_TEMP/happ-provenance.txt"
          python3 tools/happ/daily.py snapshot --source "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Full Surge build with explicit local inputs and binary readback
        run: |
          # No --categories: the existing builder audits ALL recursive Surge categories.
          python3 tools/happ/build.py \
            --geosite-tool "$TOOLS/bin/geosite" \
            --geoip-tool "$TOOLS/bin/geoip" \
            --geo-reader "$TOOLS/bin/geo-reader" \
            --output "$OUT" 2>&1 | tee "$RUNNER_TEMP/happ-build.log"

      - name: ChinaOnly build with binary readback
        run: |
          python3 tools/happ/build.py --categories ChinaMax ChinaMaxNoIP ChinaMaxNoMedia \
            --geosite-tool "$TOOLS/bin/geosite" \
            --geoip-tool "$TOOLS/bin/geoip" \
            --geo-reader "$TOOLS/bin/geo-reader" \
            --output "$OUT/chinaonly" 2>&1 | tee "$RUNNER_TEMP/happ-chinaonly-build.log"

      - name: Verify, commit only changed rules, and prepare compact release metadata
        id: target
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 tools/happ/daily.py verify --source "$SOURCE_SHA" --output "$OUT"
          if ! git diff --cached --quiet -- rule/; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore(rules): sync blackmatrix7/ios_rule_script@$SOURCE_SHA"
          fi
          target_sha="$(git rev-parse HEAD)"
          python3 tools/happ/daily.py manifest --source "$SOURCE_SHA" --base "$BASE_SHA" \
            --target "$target_sha" --output "$OUT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Preserve full diagnostics (including failures), not as release attachments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: happ-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/happ-output/
            ${{ runner.temp }}/happ-tests.log
            ${{ runner.temp }}/happ-build.log
            ${{ runner.temp }}/happ-chinaonly-build.log
            ${{ runner.temp }}/happ-provenance.txt
            ${{ runner.temp }}/happ-pins.tsv
          retention-days: 14
          if-no-files-found: warn

      - name: Normal push; abort on external advancement (never force or rebase)
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          test "$remote_sha" = "$BASE_SHA"
          if [ "$TARGET_SHA" != "$BASE_SHA" ]; then
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          test "$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)" = "$TARGET_SHA"

      - name: Upload a draft completely, then publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: lay-g/ios_rule_script
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          tag="happ-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd "$OUT" && sha256sum --check SHA256SUMS)
          gh release create "$tag" --target "$TARGET_SHA" --draft \
            --title "Happ data snapshot $tag" --notes-file "$OUT/release-notes.md"
          gh release upload "$tag" "$OUT/geosite.dat" "$OUT/geoip.dat" "$OUT/SHA256SUMS" \
            "$OUT/geosite-chinaonly.dat" "$OUT/geoip-chinaonly.dat" \
            "$OUT/build-manifest.json" "$OUT/release-notes.md"
          gh release edit "$tag" --draft=false --latest
